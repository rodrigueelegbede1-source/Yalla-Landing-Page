# 4 Go, et non les 8 Go par défaut de Flutter.
#
# POURQUOI : sur cette machine, le daemon Gradle réclamait 8 Go et la JVM
# finissait par tomber en « insufficient memory for the Java Runtime
# Environment », en emportant le build. Le message remonté par Flutter, lui,
# ne disait que « Gradle task assembleRelease failed », sans jamais mentionner
# la mémoire : trois tentatives de compilation ont été perdues à chercher la
# cause ailleurs, dans la configuration des architectures et de l'obfuscation.
#
# 4 Go suffisent largement pour ce projet et laissent la place à un émulateur
# qui tourne en parallèle.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
