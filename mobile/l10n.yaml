# Génération des traductions.
#
#   flutter gen-l10n
#
# Les fichiers .arb sont la source, `lib/l10n/app_localizations.dart` est
# généré et n'est pas commité : il se régénère à chaque compilation.
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: L
nullable-getter: false
