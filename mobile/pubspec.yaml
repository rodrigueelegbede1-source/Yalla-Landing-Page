name: yalla_mobile
description: Application mobile Yalla — géolocalisation, ruptures de stock, caisse enregistreuse.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation par rôle (5 interfaces)
  go_router: ^14.2.0

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Réseau
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # Cartographie et géolocalisation
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Base locale embarquée — mode hors-ligne pour la caisse et le signalement de rupture
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Notifications push
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
