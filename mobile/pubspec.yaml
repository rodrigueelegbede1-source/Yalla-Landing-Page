name: yalla_mobile
description: Application mobile Yalla — caisse, signalement de ruptures et livraison pour la distribution de proximité en Côte d'Ivoire.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

# Périmètre du MVP : trois rôles seulement, Point de vente, Distributeur et
# Livreur. Les dépendances des rôles hors périmètre ont été retirées, ainsi que
# celles qui étaient déclarées « en prévision » et n'ont jamais servi.
dependencies:
  flutter:
    sdk: flutter

  # Base, authentification et temps réel. Remplace à lui seul dio,
  # socket_io_client et flutter_secure_storage : le client Supabase porte la
  # session, la rafraîchit et gère la persistance sécurisée du jeton.
  supabase_flutter: ^2.5.6

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Position du livreur. Seul besoin natif du MVP.
  geolocator: ^13.0.1

  # Formatage des montants en francs CFA et des dates en français.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
