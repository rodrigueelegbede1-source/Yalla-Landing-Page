name: yalla_mobile
description: Application mobile Yalla — géolocalisation, ruptures de stock, caisse enregistreuse.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation par rôle (5 interfaces)
  go_router: ^14.2.0

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Réseau
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # Cartographie et géolocalisation
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Notifications push
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
