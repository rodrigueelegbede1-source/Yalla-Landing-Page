name: yalla_mobile
description: Application mobile Yalla — caisse, signalement de ruptures et livraison pour la distribution de proximité en Côte d'Ivoire.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

# Périmètre du MVP : trois rôles seulement, Point de vente, Distributeur et
# Livreur. Les dépendances des rôles hors périmètre ont été retirées, ainsi que
# celles qui étaient déclarées « en prévision » et n'ont jamais servi.
dependencies:
  flutter:
    sdk: flutter

  # Traductions et sens de lecture.
  #
  # Une grande partie des boutiquiers de proximité d'Abidjan lisent et écrivent
  # l'arabe plus couramment que le français. L'application se lit donc dans les
  # deux langues, et l'arabe entraîne le passage en droite-à-gauche : ce n'est
  # pas qu'une question de vocabulaire, toute la disposition s'inverse.
  flutter_localizations:
    sdk: flutter

  # Base, authentification et temps réel. Remplace à lui seul dio,
  # socket_io_client et flutter_secure_storage : le client Supabase porte la
  # session, la rafraîchit et gère la persistance sécurisée du jeton.
  supabase_flutter: ^2.5.6

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Position du livreur. Seul besoin natif du MVP.
  geolocator: ^13.0.1

  # Appel téléphonique de la boutique et ouverture de l itinéraire.
  url_launcher: ^6.3.0

  # Choix de langue conservé sur l appareil.
  shared_preferences: ^2.2.3

  # Formatage des montants en francs CFA et des dates en français.
  # Version imposée par flutter_localizations du SDK courant.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Déclenche `flutter gen-l10n` à la compilation, d'après `l10n.yaml`.
  generate: true
